name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: |
          for env in $(python -m eurl.cli list | awk '{print $1}'); do
            python -m eurl.cli check "$env" --cases 40 > /dev/null
          done
